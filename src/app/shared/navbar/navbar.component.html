<nav class="navbar">

  <div class="navbar-header">

    <a
      class="brand"
      routerLink="/dashboard/productos"
      (click)="cerrarMenu()"
    >
      Examen TAP
    </a>

    <button
      type="button"
      class="menu-button"
      aria-label="Abrir o cerrar menú"
      [attr.aria-expanded]="menuAbierto"
      (click)="cambiarMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <div
    class="nav-links"
    [class.open]="menuAbierto"
  >

    <a
      *ngIf="puedeVerProductos"
      routerLink="/dashboard/productos"
      routerLinkActive="active"
      (click)="cerrarMenu()"
    >
      <i class="fa-solid fa-box"></i>
      Productos
    </a>

    <a
      *ngIf="puedeVerUsuarios"
      routerLink="/dashboard/usuarios"
      routerLinkActive="active"
      (click)="cerrarMenu()"
    >
      <i class="fa-solid fa-users"></i>
      Usuarios
    </a>

    <a
      *ngIf="puedeVerPerfiles"
      routerLink="/dashboard/perfiles"
      routerLinkActive="active"
      (click)="cerrarMenu()"
    >
      <i class="fa-solid fa-id-card"></i>
      Perfiles
    </a>

    <a
      *ngIf="puedeVerPermisos"
      routerLink="/dashboard/permisos"
      routerLinkActive="active"
      (click)="cerrarMenu()"
    >
      <i class="fa-solid fa-key"></i>
      Permisos
    </a>

  </div>

  <div
    class="user-section"
    [class.open]="menuAbierto"
  >

    <div class="user-identity">

      <div
        class="user-photo"
        *ngIf="
          usuario?.SFotoPerfil &&
          mostrarFoto;
          else userInitial
        "
      >
        <img
          [src]="usuario?.SFotoPerfil"
          [alt]="usuario?.SNombre || 'Usuario'"
          (error)="ocultarFoto()"
        >
      </div>

      <ng-template #userInitial>
        <div class="user-initial">
          {{ obtenerInicial() }}
        </div>
      </ng-template>

      <div class="user-data">

        <span class="user-name">
          {{ usuario?.SNombre || 'Usuario' }}
        </span>

        <span class="user-email">
          {{ usuario?.SUsuario || '' }}
        </span>

      </div>

    </div>

    <div class="account-actions">

      <a
        class="account-link"
        routerLink="/dashboard/mi-perfil"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        <i class="fa-solid fa-user-pen"></i>
        Mi perfil
      </a>


      <button
        type="button"
        class="logout-button"
        [disabled]="cerrandoSesion"
        (click)="cerrarSesion()"
      >
        <i class="fa-solid fa-right-from-bracket"></i>

        <span *ngIf="!cerrandoSesion">
          Cerrar sesión
        </span>

        <span *ngIf="cerrandoSesion">
          Cerrando...
        </span>
      </button>

    </div>

  </div>

</nav>
