<section class="password-page">

  <div class="password-card">

    <div class="card-icon">
      <i class="fa-solid fa-lock"></i>
    </div>

    <div class="card-header">
      <h1>Cambiar contraseña</h1>

      <p>
        Escribe y confirma tu nueva contraseña.
      </p>
    </div>

    <div
      class="success-message"
      *ngIf="mensajeExito"
    >
      {{ mensajeExito }}
    </div>

    <div
      class="error-message"
      *ngIf="mensajeError"
    >
      {{ mensajeError }}
    </div>

    <form
      [formGroup]="passwordForm"
      (ngSubmit)="cambiarPassword()"
    >

      <div class="form-group">

        <label for="SPassword">
          Nueva contraseña
        </label>

        <div class="password-field">

          <input
            id="SPassword"
            [type]="mostrarPassword ? 'text' : 'password'"
            formControlName="SPassword"
            placeholder="Nueva contraseña"
            autocomplete="new-password"
          >

          <button
            type="button"
            aria-label="Mostrar u ocultar contraseña"
            (click)="cambiarVisibilidadPassword()"
          >
            <i
              class="fa-solid"
              [class.fa-eye]="!mostrarPassword"
              [class.fa-eye-slash]="mostrarPassword"
            ></i>
          </button>

        </div>

        <small class="help-text">
          Mínimo 8 caracteres, mayúscula, minúscula,
          número y símbolo.
        </small>

        <small
          class="validation-error"
          *ngIf="
            passwordForm.controls['SPassword'].invalid &&
            passwordForm.controls['SPassword'].touched
          "
        >
          La contraseña no cumple los requisitos.
        </small>

      </div>

      <div class="form-group">

        <label for="SPassword_confirmation">
          Confirmar nueva contraseña
        </label>

        <div class="password-field">

          <input
            id="SPassword_confirmation"
            [type]="
              mostrarConfirmacion
                ? 'text'
                : 'password'
            "
            formControlName="SPassword_confirmation"
            placeholder="Confirma la contraseña"
            autocomplete="new-password"
          >

          <button
            type="button"
            aria-label="Mostrar u ocultar confirmación"
            (click)="cambiarVisibilidadConfirmacion()"
          >
            <i
              class="fa-solid"
              [class.fa-eye]="!mostrarConfirmacion"
              [class.fa-eye-slash]="mostrarConfirmacion"
            ></i>
          </button>

        </div>

        <small
          class="validation-error"
          *ngIf="
            passwordForm.hasError('passwordsNoCoinciden') &&
            passwordForm.controls[
              'SPassword_confirmation'
            ].touched
          "
        >
          Las contraseñas no coinciden.
        </small>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="cancel-button"
          [disabled]="guardando"
          (click)="cancelar()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="save-button"
          [disabled]="guardando"
        >
          <i class="fa-solid fa-key"></i>

          {{
            guardando
              ? 'Guardando...'
              : 'Cambiar contraseña'
          }}
        </button>

      </div>

    </form>

  </div>

</section>
