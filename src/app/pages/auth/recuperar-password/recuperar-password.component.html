<div class="recover-container">

  <div class="recover-card">

    <h1>Recuperar contraseña</h1>

    <p class="subtitle">
      Ingresa el correo asociado a tu cuenta.
    </p>

    <form
      [formGroup]="recuperarForm"
      (ngSubmit)="recuperarPassword()"
    >

      <div class="form-group">

        <label for="SUsuario">
          Correo electrónico
        </label>

        <input
          id="SUsuario"
          type="email"
          formControlName="SUsuario"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        >

        <small
          class="validation-error"
          *ngIf="
            recuperarForm.controls['SUsuario'].hasError('required') &&
            recuperarForm.controls['SUsuario'].touched
          "
        >
          El correo electrónico es obligatorio.
        </small>

        <small
          class="validation-error"
          *ngIf="
            recuperarForm.controls['SUsuario'].hasError('email') &&
            recuperarForm.controls['SUsuario'].touched
          "
        >
          Ingresa un correo electrónico válido.
        </small>

      </div>

      <div
        class="api-error"
        *ngIf="mensajeError"
      >
        {{ mensajeError }}
      </div>

      <div
        class="success-message"
        *ngIf="mensajeExito"
      >
        {{ mensajeExito }}
      </div>

      <button
        type="submit"
        [disabled]="cargando"
      >
        {{ cargando ? 'Enviando...' : 'Enviar contraseña temporal' }}
      </button>

    </form>

    <a
      class="login-link"
      routerLink="/login"
    >
      Regresar al inicio de sesión
    </a>

  </div>

</div>
